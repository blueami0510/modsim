<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설계와 해석이 동시에 가능하다고? MODSIM 핵심 데모</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-color: #ffffff;
            font-family: sans-serif;
        }
        .content-container {
            text-align: center;
            max-width: 720px;
            width: 100%;
        }
        .content-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .content-container a {
            display: block;
            line-height: 0;
            cursor: pointer;
        }

        /* 유튜브 팝업 모달 배경 스타일 */
        .video-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        /* 팝업 내부 동영상 비율 박스 (16:9) */
        .modal-content {
            position: relative;
            width: 90%;
            max-width: 800px;
            background: #000;
            padding-top: 56.25%; 
        }
        .modal-content iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* 닫기 버튼 스타일 */
        .close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>

<body>
    <div class="content-container">
        <!-- 클릭 시 팝업을 여는 이미지 링크 -->
        <a id="openVideo">
            <img src="https://res.cloudinary.com/mjjmfmi5/image/upload/v1792125513/1st_modsim_size.jpg" alt="설계와 해석이 동시에 가능하다고? MODSIM 핵심 데모 영상 보기">
        </a>
    </div>

    <!-- 유튜브 팝업 레이어 -->
    <div id="videoModal" class="video-modal">
        <div class="modal-content">
            <button class="close-btn" id="closeVideo">&times;</button>
            <iframe id="youtubeIframe" src="" title="MODSIM 핵심 데모" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const modal = document.getElementById('videoModal');
        const openBtn = document.getElementById('openVideo');
        const closeBtn = document.getElementById('closeVideo');
        const iframe = document.getElementById('youtubeIframe');
        const videoUrl = "https://www.youtube.com/embed/H8A-fnpTgmU?autoplay=1"; // 팝업 열릴 때 자동재생

        // 이미지 클릭 시 팝업 열기
        openBtn.addEventListener('click', function(e) {
            e.preventDefault();
            modal.style.display = 'flex';
            iframe.src = videoUrl;
        });

        // 닫기 버튼 클릭 시 팝업 닫기 및 영상 정지
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
            iframe.src = '';
        });

        // 팝업창 바깥 배경 클릭 시 닫기
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.style.display = 'none';
                iframe.src = '';
            }
        });
    </script>
</body>
</html>
